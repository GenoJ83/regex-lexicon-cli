[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regex-lexicon-cli"
version = "0.1.0"
description = "CLI regex library, catastrophic backtracking detector, and benchmarker"
authors = [{ name = "Geno Joshua" }]
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
